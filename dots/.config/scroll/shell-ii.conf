# Shell binds for illogical-impulse (ii, ~/Projects/ii-scroll, branch scroll). Selected via
# the shell.conf symlink (~/.local/bin/shell-switch).
# Base: furansi-13's translation of upstream keybinds.lua (ii-binds.conf), plus the keys
# DMS used to own. Since 11/9 the binds match upstream 1:1 (no more Scroll-strip clashes).
# Categories ("### X") and "#! text" comments feed ii's cheatsheet (Super+/).

# (sway expands the longest variable name first, so $iis never parses as $ii + "s")
set $ii qs -c ii ipc call
set $iis qs -c ii ipc call shortcut trigger

### Shell
#! Toggle search (tap Super)
bindsym --release Super_L     exec $ii search toggle
bindsym --release Super_R     exec $ii search toggle
# Super+Space too, because a tap of Super isn't reliable here (see NOTES.md)
bindsym $mod+space            exec $ii search toggle
#! Toggle overview
bindsym $mod+Tab              exec $iis overviewWorkspacesToggle
#! Clipboard history
bindsym $mod+v                exec $iis overviewClipboardToggle
#! Emoji
bindsym $mod+period           exec $iis overviewEmojiToggle
#! Toggle left sidebar
bindsym $mod+a                exec $iis sidebarLeftToggle
bindsym $mod+Alt+a            exec $iis sidebarLeftToggleDetach
bindsym $mod+b                exec $iis sidebarLeftToggle
bindsym $mod+o                exec $iis sidebarLeftToggle
#! Toggle right sidebar
bindsym $mod+n                exec $iis sidebarRightToggle
#! Toggle cheatsheet
bindsym $mod+slash            exec $iis cheatsheetToggle
#! Toggle on-screen keyboard
bindsym $mod+k                exec $iis oskToggle
#! Toggle media controls
bindsym $mod+m                exec $iis mediaControlsToggle
#! Toggle widget overlay
bindsym $mod+g                exec $iis overlayToggle
#! Toggle session menu
bindsym Ctrl+Alt+Delete       exec $iis sessionToggle
#! Toggle bar
bindsym $mod+j                exec $iis barToggle
#! Change wallpaper
bindsym Ctrl+$mod+t           exec $iis wallpaperSelectorToggle
#! Random wallpaper
bindsym Ctrl+$mod+Alt+t       exec $iis wallpaperSelectorRandom
#! Toggle light/dark mode
bindsym Ctrl+$mod+Shift+d     exec $iis toggleLightDark
#! Restart widgets
# Upstream runs `killall ydotool qs quickshell`, which would also kill DMS's qs
# (and the greeter's if it runs as you), so match ii's own process.
bindsym Ctrl+$mod+r           exec ~/.local/bin/shell-switch --restart-ii
#! Cycle panel family
bindsym Ctrl+$mod+p           exec $iis panelFamilyCycle
bindsym $mod+Shift+Alt+slash  exec qs -p ~/.config/quickshell/ii/welcome.qml

### Utilities
#! Screen snip
bindsym $mod+Shift+s          exec $iis regionScreenshot
#! Google Lens
bindsym $mod+Shift+a          exec $iis regionSearch
#! Character recognition >> clipboard
bindsym $mod+Shift+x          exec $iis regionOcr
#! Translate screen content
bindsym $mod+Shift+t          exec $iis screenTranslate
#! Record region (no sound)
bindsym --locked $mod+Shift+r exec $iis regionRecord
bindsym --locked $mod+Alt+r   exec $iis regionRecord
#! Record region (with sound)
# Upstream runs record.sh --fullscreen --sound here (hyprctl, doesn't work on Scroll).
bindsym --locked $mod+Shift+Alt+r exec $iis regionRecordWithSound
#! Screenshot >> clipboard
bindsym --locked Print        exec sh -c 'grim -o "$(scrollmsg -t get_workspaces | jq -r ".[] | select(.focused).output")" - | wl-copy'
#! Screenshot >> clipboard & file
bindsym --locked Ctrl+Print   exec sh -c 'd="$(xdg-user-dir PICTURES)/Screenshots"; f="$d/Screenshot_$(date +%Y-%m-%d_%H.%M.%S).png"; mkdir -p "$d" && grim -o "$(scrollmsg -t get_workspaces | jq -r ".[] | select(.focused).output")" "$f" && wl-copy < "$f"'
#! Annotate a screenshot (not in upstream)
bindsym $mod+Print            exec sh -c 'grim - | satty --filename -'
# Upstream Super+Shift+C = hyprpicker (not installed); here it stays `reload`.

### Screen
#! Brightness
bindsym --locked XF86MonBrightnessUp   exec $ii brightness increment
bindsym --locked XF86MonBrightnessDown exec $ii brightness decrement

### Session
#! Lock
bindsym $mod+l                exec $iis lock

### Apps
#! Text editor
bindsym $mod+x                exec uwsm app -- gnome-text-editor
#! Settings app
bindsym $mod+i                exec qs -p ~/.config/quickshell/ii/settings.qml
