# illogical-impulse (ii) keybinds for Scroll
#
# Translated from upstream dots/.config/hypr/hyprland/keybinds.lua (end-4 cb1c428).
# Every shortcut name below exists as a GlobalShortcut in the ii panel family
# (modules/waffle skipped). Shortcuts go through the compat registry in
# modules/compat/GlobalShortcutRegistry.qml (IPC target "shortcut"); a few use
# ii's own IpcHandlers directly, the same way upstream does.
#
# Not included anywhere yet. Suggested use: `include ~/.config/scroll/ii-binds.conf`
# AFTER the DMS binds are removed (otherwise DMS and ii both own the same keys).
#
# Clashes are checked against ~/.config/scroll/config as of 2026-11-09.
# A commented-out line with "CLASH:" means upstream's combo is already taken.
# See NOTES.md for the full table.

# (sway expands the longest variable name first, so $iis never parses as $ii + "s")
set $ii qs -c ii ipc call
set $iis qs -c ii ipc call shortcut trigger

# ---------------------------------------------------------------- Shell panels
bindsym $mod+Tab              exec $iis overviewWorkspacesToggle
bindsym $mod+v                exec $iis overviewClipboardToggle
bindsym $mod+Alt+a            exec $iis sidebarLeftToggleDetach
bindsym $mod+b                exec $iis sidebarLeftToggle
bindsym $mod+o                exec $iis sidebarLeftToggle
bindsym $mod+n                exec $iis sidebarRightToggle
bindsym $mod+slash            exec $iis cheatsheetToggle
bindsym $mod+k                exec $iis oskToggle
bindsym $mod+j                exec $iis barToggle
bindsym Ctrl+Alt+Delete       exec $iis sessionToggle
bindsym Ctrl+$mod+t           exec $iis wallpaperSelectorToggle
bindsym Ctrl+$mod+Alt+t       exec $iis wallpaperSelectorRandom
bindsym Ctrl+$mod+Shift+d     exec $iis toggleLightDark
bindsym Ctrl+$mod+p           exec $iis panelFamilyCycle

# CLASH: $mod+a = DMS control-center toggle
#bindsym $mod+a               exec $iis sidebarLeftToggle
# CLASH: $mod+period = "move right nomode"
#bindsym $mod+period          exec $iis overviewEmojiToggle
# CLASH: $mod+m = "set_size h 1.0"
#bindsym $mod+m               exec $iis mediaControlsToggle
# CLASH: $mod+g = "scale_workspaces toggle" (Scroll's own overview)
#bindsym $mod+g               exec $iis overlayToggle

# Restart ii only. Upstream runs `killall ydotool qs quickshell`, which would
# also kill DMS's qs (and the greeter's if it runs as you), so match ii's own process.
bindsym Ctrl+$mod+r           exec sh -c 'pkill -f "^qs -c ii( |$)"; sleep 0.3; exec qs -c ii'

# First-run welcome window (upstream Shift+Super+Alt+Slash). Optional.
#bindsym $mod+Shift+Alt+slash exec qs -p ~/.config/quickshell/ii/welcome.qml

# ---------------------------------------------------------------- Search / Super key
# Upstream: tap Super (release) = toggle search, hold Super = show workspace numbers.
# Scroll (sway) can't do both on one bare modifier: when Super_L has a press
# binding, it clears the pending --release binding (sway/input/keyboard.c:619), so
# the release never fires. Pick ONE of the options below.
#
# Option A, tap Super to search. Caveat: a --release bind on a bare modifier
# is only cancelled by another *keyboard* binding. Super+wheel (your
# $mod+button4/5 workspace switch) and Super+drag (floating_modifier) don't
# cancel it, so releasing Super after those would also open search.
#bindsym --release Super_L    exec $ii search toggle
#bindsym --release Super_R    exec $ii search toggle
#
# Option B (recommended): a normal combo. CLASH: $mod+space = DMS spotlight
#bindsym $mod+space           exec $ii search toggle
#
# Hold-Super workspace numbers (workspaceNumber press/release). Spawns a qs process
# on every Super press and breaks Option A, so it's off by default.
#bindsym Super_L              exec qs -c ii ipc call shortcut press workspaceNumber
#bindsym --release Super_L    exec qs -c ii ipc call shortcut release workspaceNumber

# ---------------------------------------------------------------- Region tools (ii regionSelector)
bindsym $mod+Shift+s          exec $iis regionScreenshot
bindsym $mod+Shift+a          exec $iis regionSearch
bindsym $mod+Shift+x          exec $iis regionOcr
bindsym --locked $mod+Alt+r   exec $iis regionRecord
# No upstream bind for regionRecordWithSound. Upstream's Super+Shift+Alt+R runs
# record.sh --fullscreen --sound, which uses hyprctl + wf-recorder (neither works
# here), so this combo is reused for the ii region recorder with sound.
bindsym --locked $mod+Shift+Alt+r exec $iis regionRecordWithSound

# CLASH: $mod+Shift+t = "focus mode_toggle"
#bindsym $mod+Shift+t         exec $iis screenTranslate
# CLASH: $mod+Shift+r = "cycle_size h prev"
#bindsym --locked $mod+Shift+r exec $iis regionRecord

